<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1220">
<title>Party Night</title>
<style>
:root{
  --bg:#0f1220; --panel:#181c30; --panel2:#222848; --ink:#f2f4ff; --muted:#9aa3c7;
  --accent:#7c5cff; --accent2:#ff6b9a; --good:#3ddc97; --bad:#ff5d6c; --warn:#ffb84d; --line:#2c3358;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#0f1220}
html,body{margin:0}
body{
  background:radial-gradient(1200px 600px at 50% -10%,#2a2160 0,#0f1220 62%) fixed;
  color:var(--ink); min-height:100vh;
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 90px}
h1{font-size:34px;margin:6px 0 4px;letter-spacing:.5px}
h2{font-size:18px;margin:0 0 10px}
p{margin:6px 0}
.muted{color:var(--muted)}
.sub{color:var(--muted);margin:0 0 18px}
.home{text-align:center;padding-top:40px}
.home .card{text-align:left}
.logo{font-size:54px}
.foot{font-size:13px;margin-top:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}
input[type=text],input:not([type]){
  width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);
  background:#10142a;color:var(--ink);font-size:17px;outline:none;
}
input:focus{border-color:var(--accent)}
.row{display:flex;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.row>input{flex:1}
.btn{
  appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--ink);
  padding:13px 16px;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;width:100%;margin-top:10px;
}
.row .btn{width:auto;margin-top:0}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none}
.btn.small{padding:8px 12px;font-size:14px;width:auto;margin:0}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:active:not(:disabled){transform:scale(.98)}
.link{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:14px;cursor:pointer;margin-top:12px;padding:6px}
.or{text-align:center;color:var(--muted);font-size:13px;margin:16px 0 10px}
.banner{padding:11px 14px;border-radius:12px;margin:10px 0;font-size:15px}
.banner.bad{background:#3a1a24;border:1px solid #6b2a39;color:#ffc2ca}
.banner.warn{background:#3a2e14;border:1px solid #6b5420;color:#ffe2a8}
.banner.good{background:#14382b;border:1px solid #1f6a4e;color:#b7f5da}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.brand{font-weight:800;letter-spacing:.3px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;letter-spacing:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{
  appearance:none;border:1px solid var(--line);background:#10142a;color:var(--ink);
  padding:7px 12px;border-radius:999px;font-size:14px;cursor:pointer;
}
.chipbtn.on{background:var(--accent);border-color:var(--accent)}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;appearance:none;border:none;background:#10142a;color:var(--ink);padding:10px 6px;font-size:14px;cursor:pointer}
.seg button.on{background:var(--accent)}
.seg button+button{border-left:1px solid var(--line)}
.setting{margin:14px 0}
.setting>label{margin-bottom:8px}
.stepper{display:flex;align-items:center;gap:14px}
.stepper b{font-size:20px;min-width:24px;text-align:center}
.stepper button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:20px;cursor:pointer}
.stepper button:disabled{opacity:.4}
.games{display:flex;gap:8px;flex-wrap:wrap}
.game{flex:1;min-width:120px;appearance:none;border:1px solid var(--line);background:#10142a;color:var(--ink);padding:12px;border-radius:12px;font-size:15px;font-weight:700}
.game.on{border-color:var(--accent);background:#241f55}
.game:disabled{opacity:.5}
.game small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line)}
.plist li:last-child{border-bottom:none}
.plist li.cur{background:#241f55;border-radius:10px;padding-left:8px}
.plist li.out .nm{text-decoration:line-through;opacity:.55}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--panel2);color:var(--muted)}
.tag.good{background:#14382b;color:#7cf0bd}
.tag.bad{background:#3a1a24;color:#ff9aa8}
.tag.host{background:#2a2160;color:#c9bcff}
.tag.neutral{background:#3a2e14;color:#ffd58a}
.btn.big{font-size:18px;padding:16px}
.btn.join{background:linear-gradient(135deg,#19c3a3,#3ddc97);color:#06281d;border:none;font-size:18px;font-weight:800;padding:16px}
.codeinput{text-align:center;letter-spacing:8px;font-size:24px;font-weight:800;text-transform:uppercase}
.joinbox{text-align:center;margin:16px 0 4px}
.roomcode{display:inline-block;font-size:34px;font-weight:900;letter-spacing:8px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:6px 18px;margin-top:4px}
.secret .role{text-align:center;padding:8px 0}
.narr li{cursor:pointer}
.script{padding-left:22px;margin:6px 0}
.script li{margin:8px 0}
.word{font-size:40px;font-weight:900;margin:8px 0;letter-spacing:.5px}
.role.imp .tag{font-size:15px}
.big{font-size:22px;font-weight:800;text-align:center;margin:6px 0 10px}
.winner{border:2px solid var(--good)}
.winner.imp{border-color:var(--accent2)}
.spinner{width:34px;height:34px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);margin:18px auto;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#2b3160;border:1px solid var(--line);padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:9}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<noscript><p style="padding:20px">Party Night needs JavaScript to run.</p></noscript>

<!-- Networking library (peer to peer, free). A second CDN is used if the first one fails. -->
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js" onerror="document.write('<script src=&quot;https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js&quot;><\/script>')"></script>

<script>
'use strict';

/* ==========================================================================
   Word library. Format per line:  word | light hint | strong hint
   The imposter sees the category plus (optionally) one of the hints.
   ========================================================================== */
const CAT_DATA = {
'Food': `Pizza|shared|cheese
Sushi|Japanese|fish
Burger|fast|patty
Pancakes|breakfast|syrup
Ice cream|cold|scoop
Fried rice|Asian|wok
Tacos|folded|Mexican
Chocolate|sweet|cocoa
Popcorn|snack|kernels
Noodles|slurp|strands`,
'Animals': `Elephant|big|trunk
Penguin|cold|flightless
Giraffe|tall|neck
Dolphin|ocean|flipper
Kangaroo|hop|pouch
Owl|night|hoot
Octopus|soft|tentacles
Monkey|climb|banana
Shark|feared|fin
Butterfly|colourful|caterpillar`,
'Places': `Library|quiet|books
Beach|sandy|waves
Airport|waiting|runway
Hospital|worried|ward
Supermarket|trolleys|aisles
Cinema|dark|screen
Zoo|families|animals
School|bells|classroom
Gym|sweaty|weights
Museum|history|exhibits`,
'Jobs': `Doctor|caring|stethoscope
Teacher|talking|lessons
Chef|heat|kitchen
Pilot|high|cockpit
Farmer|early|crops
Firefighter|danger|hose
Dentist|dread|teeth
Police officer|uniform|law
Photographer|looking|camera
Barista|mornings|coffee`,
'Sports': `Football|ninety|goals
Basketball|tall|hoop
Tennis|racket|Wimbledon
Swimming|wet|lanes
Badminton|feathers|shuttlecock
Cricket|long|wickets
Boxing|gloves|ring
Volleyball|net|spike
Golf|quiet|clubs
Cycling|wheels|pedals`,
'Household Items': `Toothbrush|morning|bristles
Pillow|soft|bed
Fridge|hums|chilled
Umbrella|weather|rain
Scissors|sharp|snip
Mirror|bathroom|reflection
Kettle|hot|steam
Sofa|comfy|cushions
Clock|ticking|minutes
Broom|cleaning|sweep`,
'Transport': `Bicycle|healthy|handlebars
Train|tracks|station
Airplane|sky|wings
Bus|public|route
Taxi|hired|meter
Ferry|water|crossing
Motorbike|loud|helmet
Helicopter|spinning|rotor
Skateboard|tricks|ramp
Submarine|deep|periscope`,
'Fruit': `Apple|crunchy|core
Banana|yellow|peel
Watermelon|summer|seeds
Pineapple|spiky|tropical
Strawberry|red|jam
Mango|messy|stone
Grapes|bunch|wine
Orange|colour|citrus
Durian|smelly|pungent
Coconut|hard|husk`
};

const CATEGORIES = {};
for (const [name, raw] of Object.entries(CAT_DATA)) {
  CATEGORIES[name] = raw.trim().split('\n').map(line => {
    const [w, light, strong] = line.split('|').map(s => s.trim());
    return { w, light, strong };
  });
}

/* ==========================================================================
   Small helpers
   ========================================================================== */
const PREFIX = 'partynight-v1-';
const LETTERS = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
const PEER_OPTS = window.__PEER_OPTS || {};
const $app = document.getElementById('app');

const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 6);
const cleanName = n => String(n || '').replace(/\s+/g, ' ').trim().slice(0, 16) || 'Player';
const norm = s => String(s).toLowerCase().replace(/[^a-z0-9]/g, '').replace(/s$/, '');
const randomCode = () => Array.from({ length: 4 }, () => LETTERS[rnd(LETTERS.length)]).join('');
function hue(id) { let h = 0; for (const ch of String(id)) h = (h * 31 + ch.charCodeAt(0)) % 360; return h; }
function store(kind, key, val) {
  try {
    const s = kind === 'local' ? localStorage : sessionStorage;
    if (val === undefined) return s.getItem(key);
    s.setItem(key, val);
  } catch (e) { return null; }
}
const PID = store('session', 'pn_pid') || (() => { const p = uid(); store('session', 'pn_pid', p); return p; })();

const defaultSettings = () => ({
  game: 'imposter',
  cats: Object.keys(CATEGORIES), imposters: 1, hint: 'light',
  narrator: true,
  werewolves: 'auto', ww: { seer: true, doctor: true, witch: false, hunter: false, cupid: false, mason: false, tanner: false },
  mafia: 'auto', mf: { detective: true, doctor: true, godfather: false, vigilante: false, bodyguard: false, escort: false, jester: false }
});

/* Role sets for the two night games. The app only deals the roles. A narrator (usually the host) runs the nights in person. */
const ROLE_SETS = {
  werewolf: {
    title: 'Werewolf', countKey: 'werewolves', optKey: 'ww', evil: 'werewolf', plain: 'villager', mateWord: 'pack',
    teamName: { good: 'Villagers', evil: 'Werewolves', neutral: 'On your own' },
    roles: {
      villager: { name: 'Villager', team: 'good', blurb: 'You have no special power. Listen, talk, and work out who the werewolves are.' },
      werewolf: { name: 'Werewolf', team: 'evil', blurb: 'Each night you and the other werewolves silently choose someone to eat. By day, act like a villager.' },
      seer: { name: 'Seer', team: 'good', blurb: 'Each night the narrator lets you secretly point at one player and tells you if they are a werewolf.' },
      doctor: { name: 'Doctor', team: 'good', blurb: 'Each night you secretly choose one player to protect from the werewolves. You may protect yourself.' },
      witch: { name: 'Witch', team: 'good', blurb: 'You have one potion that saves the player the werewolves chose, and one that kills any player. Each can be used once.' },
      hunter: { name: 'Hunter', team: 'good', blurb: 'If you are eliminated, you immediately take one other player down with you.' },
      cupid: { name: 'Cupid', team: 'good', blurb: 'On the first night the narrator lets you secretly choose two players to be lovers. If one lover is eliminated, the other is too.' },
      mason: { name: 'Mason', chip: 'Masons (2)', team: 'good', group: 'mason', count: 2, mateWord: 'fellow Mason', blurb: 'You have no special power, but you know the other Mason is on the village side. Trust them.' },
      tanner: { name: 'Tanner', team: 'neutral', blurb: 'You want to be eliminated. If the village votes you out, you win alone. Act suspicious, but not too much.', winNote: 'The Tanner wins alone if the village votes them out.' }
    },
    specials: ['seer', 'doctor', 'witch', 'hunter', 'cupid', 'mason', 'tanner'],
    win: 'Villagers win when every werewolf is gone. Werewolves win when they equal or outnumber the villagers.',
    script: has => { const savers = [has.doctor && 'Doctor', has.witch && 'Witch'].filter(Boolean); return [
      'Everyone closes their eyes.',
      has.cupid && 'First night only: wake Cupid. They point at two players, who become lovers. Quietly tap the two lovers so they know, then Cupid closes their eyes. If one lover is eliminated, the other is too.',
      'Wake the werewolves. They silently point at a victim, then close their eyes.',
      has.seer && 'Wake the Seer. They point at a player and you answer with a thumbs up (werewolf) or thumbs down. The Seer closes their eyes.',
      has.doctor && 'Wake the Doctor. They point at the player to protect, then close their eyes.',
      has.witch && 'Wake the Witch. Show them the victim. They may save that player and/or poison someone, then close their eyes.',
      savers.length ? 'Everyone wakes up. Announce who was eaten, unless the ' + savers.join(' or the ') + ' saved them.' : 'Everyone wakes up. Announce who was eaten.',
      has.hunter && 'If the Hunter is eliminated, they immediately take one player down with them.',
      'Everyone discusses and votes someone out. Repeat from the top until one side wins.'
    ].filter(Boolean); }
  },
  mafia: {
    title: 'Mafia', countKey: 'mafia', optKey: 'mf', evil: 'mafia', plain: 'civilian', mateWord: 'family',
    teamName: { good: 'Town', evil: 'Mafia', neutral: 'On your own' },
    roles: {
      civilian: { name: 'Civilian', team: 'good', blurb: 'You have no special power. Listen, talk, and help the town find the mafia.' },
      mafia: { name: 'Mafia', team: 'evil', blurb: 'Each night you and the rest of the mafia silently agree on someone to kill. By day, act innocent.' },
      detective: { name: 'Detective', team: 'good', blurb: 'Each night the narrator lets you secretly point at one player and tells you if they are mafia.' },
      doctor: { name: 'Doctor', team: 'good', blurb: 'Each night you secretly choose one player to save from the mafia. You may save yourself.' },
      godfather: { name: 'Godfather', team: 'evil', replaces: 'mafia', blurb: 'You lead the mafia. The Detective sees you as innocent. Each night you choose the victim together with the rest of the mafia.' },
      vigilante: { name: 'Vigilante', team: 'good', blurb: 'Once per game, at night, you may secretly point at a player and the narrator takes them out. Use it wisely.' },
      bodyguard: { name: 'Bodyguard', team: 'good', blurb: 'Each night you secretly choose one player to guard. If the mafia attack them, you die instead and they live.' },
      escort: { name: 'Escort', team: 'good', blurb: 'Each night you secretly choose one player. They cannot use their ability that night.' },
      jester: { name: 'Jester', team: 'neutral', blurb: 'You want to be eliminated. If the town votes you out, you win alone. Act suspicious, but not too much.', winNote: 'The Jester wins alone if the town votes them out.' }
    },
    specials: ['detective', 'doctor', 'godfather', 'vigilante', 'bodyguard', 'escort', 'jester'],
    win: 'Town wins when every mafia member is gone. The mafia wins when they equal or outnumber the town.',
    script: has => { const savers = [has.doctor && 'Doctor'].filter(Boolean); return [
      'Everyone closes their eyes.',
      'Wake the mafia. They silently agree on a victim by pointing, then close their eyes.',
      has.escort && 'Wake the Escort. They point at a player who cannot use their ability tonight, then close their eyes.',
      has.detective && ('Wake the Detective. They point at a player and you answer with a thumbs up (mafia) or thumbs down. The Detective closes their eyes.' + (has.godfather ? ' The Godfather counts as thumbs down, not mafia.' : '')),
      has.doctor && 'Wake the Doctor. They point at the player to save, then close their eyes.',
      has.bodyguard && 'Wake the Bodyguard. They point at the player to guard, then close their eyes.',
      has.vigilante && 'Wake the Vigilante, only if they have not used their one shot yet. They may point at a player to take out, then close their eyes.',
      (savers.length ? 'Everyone wakes up. Announce who was killed, unless the ' + savers.join(' or the ') + ' saved them.' : 'Everyone wakes up. Announce who was killed.') + (has.bodyguard ? ' If the Bodyguard guarded the victim, the Bodyguard dies instead.' : ''),
      'Everyone discusses and votes someone out. Repeat from the top until one side wins.'
    ].filter(Boolean); }
  }
};

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ==========================================================================
   Client UI state
   ========================================================================== */
const ui = {
  screen: 'home',          // home | connecting | room
  error: '',
  name: store('local', 'pn_name') || '',
  joinCode: '',            // code taken from the invite link
  codeDraft: '',
  drafts: {},              // text typed into inputs, kept across re-renders
  view: null,              // latest state view from the host
  lastJson: '',
  showCard: false,
  dead: {},
  reconnecting: false
};

let host = null;   // Host object (only on the device that created the room)
let guest = null;  // { peer, conn, leaving, tries }

/* ==========================================================================
   HOST: owns all game state. Guests only send actions and receive their own view.
   ========================================================================== */
class Host {
  constructor(code, peer, name) {
    this.code = code; this.peer = peer; this.hostId = PID;
    this.players = new Map();
    this.settings = defaultSettings();
    this.game = null;
    this.used = new Set();
    this.players.set(PID, { id: PID, name: cleanName(name), conn: null, connected: true });
    this.online = true; this.recovering = false;
    this.attach(peer);
  }

  /* Keep the room registered with the connection server. Phones pause pages in the background,
     which can drop the registration, so we re-register whenever we notice. */
  attach(peer) {
    this.peer = peer;
    peer.on('connection', conn => this.onConn(conn));
    peer.on('open', () => { this.online = true; this.broadcast(); });
    // The recover calls are deferred on purpose: PeerJS emits 'disconnected' in the middle of destroying a peer,
    // and reconnecting at that moment leaves a zombie connection that keeps holding the room code.
    peer.on('disconnected', () => { this.online = false; this.broadcast(); setTimeout(() => this.recover(), 400); });
    peer.on('error', err => { if (err && err.type !== 'peer-unavailable') setTimeout(() => this.recover(), 400); });
  }
  recover() {
    if (this.recovering) return;
    this.recovering = true;
    const step = n => {
      const peer = this.peer;
      if (peer.destroyed) this.attach(new Peer(PREFIX + this.code, PEER_OPTS));   // fully gone: same room code, fresh peer
      else if (peer.disconnected) { try { peer.reconnect(); } catch (e) { /* ignore */ } }
      else { this.recovering = false; return; }
      setTimeout(() => ((this.peer.disconnected || this.peer.destroyed) ? step(n + 1) : (this.recovering = false)), Math.min(2500 + n * 1000, 8000));
    };
    step(0);
  }
  /* Check the room can really be reached by joining it from a throwaway peer. If not, rebuild it.
     Only done in the lobby (or when nobody else is connected) so a running game is never disturbed. */
  probe() {
    const alone = [...this.players.values()].every(p => p.id === this.hostId || !p.connected);
    if (this.probing || this.recovering || !this.peer.open || !(!this.game || alone)) return;
    this.probing = true;
    let done = false;
    const test = new Peer(undefined, PEER_OPTS);
    const finish = ok => {
      if (done) return;
      done = true; clearTimeout(timer);
      try { test.destroy(); } catch (e) { /* ignore */ }
      this.probing = false;
      if (!ok) this.rebuild();
    };
    const timer = setTimeout(() => finish(false), 9000);
    test.on('open', () => {
      const c = test.connect(PREFIX + this.code, { reliable: true, serialization: 'json' });
      c.on('open', () => finish(true));
    });
    test.on('error', err => finish(!(err && err.type === 'peer-unavailable')));   // other errors are inconclusive
  }
  rebuild() {
    this.online = false; this.broadcast();
    try { this.peer.destroy(); } catch (e) { /* ignore */ }
    setTimeout(() => this.recover(), 600);
  }

  /* ---------- connections ---------- */
  onConn(conn) {
    conn.on('data', msg => { try { this.onMsg(conn, msg); } catch (e) { console.error(e); } });
    conn.on('close', () => this.onClose(conn));
    conn.on('error', () => { /* handled by close */ });
  }
  onMsg(conn, msg) {
    if (!msg || typeof msg.t !== 'string') return;
    if (msg.t === 'join') return this.join(conn, msg);
    if (!conn.pid || !this.players.has(conn.pid)) return;
    this.handle(conn.pid, msg);
  }
  join(conn, msg) {
    const pid = String(msg.pid || '').slice(0, 24);
    if (!pid) return;
    let p = this.players.get(pid);
    if (p) {                                   // coming back after a refresh or lost signal
      if (p.conn && p.conn !== conn) { try { p.conn.close(); } catch (e) { /* ignore */ } }
      p.conn = conn; p.connected = true; conn.pid = pid;
    } else {
      if (this.game) { this.reject(conn, 'That game has already started. Ask the host to start a new round.'); return; }
      if (this.players.size >= 12) { this.reject(conn, 'This room is full (12 players).'); return; }
      let name = cleanName(msg.name), base = name, i = 2;
      const taken = n => [...this.players.values()].some(x => x.name.toLowerCase() === n.toLowerCase());
      while (taken(name)) name = base.slice(0, 13) + ' ' + i++;
      p = { id: pid, name, conn, connected: true };
      this.players.set(pid, p); conn.pid = pid;
    }
    this.broadcast();
  }
  reject(conn, text) {
    try { conn.send({ t: 'error', msg: text }); } catch (e) { /* ignore */ }
    setTimeout(() => { try { conn.close(); } catch (e) { /* ignore */ } }, 400);
  }
  onClose(conn) {
    const p = this.players.get(conn.pid);
    if (!p || p.conn !== conn) return;
    if (!this.game) this.players.delete(p.id);
    else p.connected = false;
    this.broadcast();
  }
  notify(pid, msg) {
    if (pid === this.hostId) toast(msg);
    else { const p = this.players.get(pid); if (p && p.conn) try { p.conn.send({ t: 'toast', msg }); } catch (e) { /* ignore */ } }
  }

  /* ---------- views ---------- */
  viewFor(pid) {
    const g = this.game, me = this.players.get(pid);
    const v = {
      code: this.code,
      me: { id: pid, name: me.name, isHost: pid === this.hostId },
      players: [...this.players.values()].map(p => ({
        id: p.id, name: p.name, isHost: p.id === this.hostId, connected: p.connected
      })),
      settings: this.settings,
      allCats: Object.keys(CATEGORIES),
      phase: g ? g.phase : 'lobby',
      hostOnline: this.online
    };
    if (g && g.kind) this.roleView(v, g, pid);
    else if (g) {
      const imp = g.imposters.has(pid);
      v.role = { type: 'imposter', imp, cat: g.cat, word: imp ? null : g.word, hint: imp && g.hint !== 'none' ? g[g.hint] : null };
      if (g.phase === 'end') v.end = { word: g.word, cat: g.cat, imposters: [...g.imposters] };
    }
    return v;
  }
  // Werewolf and Mafia: each player only ever receives their own role. The narrator receives the full list.
  roleView(v, g, pid) {
    const def = ROLE_SETS[g.kind];
    const nameOf = id => this.players.get(id).name;
    const roster = Object.keys(g.assign).map(id => { const r = def.roles[g.assign[id]]; return { id, name: nameOf(id), roleName: r.name, team: r.team }; });
    if (pid === g.narrator) {
      const has = {}; for (const r of Object.values(g.assign)) has[r] = true;
      const win = [def.win, ...Object.keys(has).map(r => def.roles[r].winNote)].filter(Boolean).join(' ');
      v.narrator = { title: def.title, roster, script: def.script(has), win };
    } else if (g.assign[pid]) {
      const r = def.roles[g.assign[pid]];
      const grp = x => x.group || (x.team === 'evil' ? 'evil' : null);   // who recognises whom: the evil side, or the Masons
      const mates = grp(r) ? Object.keys(g.assign).filter(id => id !== pid && grp(def.roles[g.assign[id]]) === grp(r)).map(nameOf) : [];
      v.role = { type: 'role', game: def.title, name: r.name, team: r.team, teamName: def.teamName[r.team], blurb: r.blurb, mates, mateWord: r.mateWord || def.mateWord };
    }   // anyone else (joined after the roles were dealt) just waits for the next round
    if (g.phase === 'end') v.end = { kind: g.kind, title: def.title, roster, narrator: g.narrator ? nameOf(g.narrator) : null };
  }
  broadcast() {
    for (const p of this.players.values()) {
      const view = this.viewFor(p.id);
      if (p.id === this.hostId) setView(view);
      else if (p.conn && p.connected) { try { p.conn.send({ t: 'state', view }); } catch (e) { /* ignore */ } }
    }
  }

  /* ---------- actions ---------- */
  handle(pid, msg) {
    const g = this.game, isHost = pid === this.hostId;
    switch (msg.t) {
      case 'settings': if (isHost && !g) this.setSetting(msg.key, msg.val); break;
      case 'start': if (isHost && !g) this.start(); break;
      case 'finish': if (isHost && g && g.phase === 'play') g.phase = 'end'; break;
      case 'again':
        if (isHost && g && g.phase === 'end') {
          this.game = null;
          for (const p of [...this.players.values()]) if (!p.connected) this.players.delete(p.id);
        }
        break;
    }
    this.broadcast();
  }

  setSetting(key, val) {
    const s = this.settings;
    if (key === 'cat') {
      const set = new Set(s.cats);
      if (set.has(val)) set.delete(val); else if (CATEGORIES[val]) set.add(val);
      if (set.size) s.cats = Object.keys(CATEGORIES).filter(c => set.has(c));
    } else if (key === 'allcats') s.cats = Object.keys(CATEGORIES);
    else if (key === 'imposters') s.imposters = Math.max(1, Math.min(3, val | 0));
    else if (key === 'hint' && ['none', 'light', 'strong'].includes(val)) s.hint = val;
    else if (key === 'game' && ['imposter', 'werewolf', 'mafia'].includes(val)) s.game = val;
    else if (key === 'narrator') s.narrator = !!val;
    else if (key === 'werewolves' || key === 'mafia') s[key] = val === 'auto' ? 'auto' : Math.max(1, Math.min(4, val | 0));
    else if (key === 'wwrole' && ROLE_SETS.werewolf.specials.includes(val)) s.ww[val] = !s.ww[val];
    else if (key === 'mfrole' && ROLE_SETS.mafia.specials.includes(val)) s.mf[val] = !s.mf[val];
  }

  start() {
    if (this.settings.game === 'imposter') this.startImposter();
    else this.startRoles(this.settings.game);
  }
  startRoles(kind) {
    const s = this.settings, def = ROLE_SETS[kind], narrate = !!s.narrator;
    const ids = [...this.players.values()].filter(p => p.connected && !(narrate && p.id === this.hostId)).map(p => p.id);
    if (ids.length < 4) { this.notify(this.hostId, 'You need at least 4 players' + (narrate ? ' besides the narrator.' : '.')); return; }
    const n = ids.length;
    const evilCount = Math.min(s[def.countKey] === 'auto' ? Math.max(1, Math.round(n / 4)) : s[def.countKey], Math.floor((n - 1) / 2));
    const list = Array(evilCount).fill(def.evil);
    const skipped = [];
    for (const r of def.specials) {
      if (!s[def.optKey][r]) continue;
      const role = def.roles[r];
      if (role.replaces) {                          // for example the Godfather takes the place of one mafia member
        const i = list.indexOf(role.replaces);
        if (i >= 0) list[i] = r; else skipped.push(role.name);
        continue;
      }
      const need = role.count || 1;                 // for example the Masons come as a pair
      if (list.length + need <= n - 1) for (let k = 0; k < need; k++) list.push(r);   // always keep room for a plain player
      else skipped.push(role.name);
    }
    while (list.length < n) list.push(def.plain);
    const roles = shuffle(list), assign = {};
    ids.forEach((id, i) => { assign[id] = roles[i]; });
    this.game = { kind, phase: 'play', assign, narrator: narrate ? this.hostId : null };
    if (skipped.length) this.notify(this.hostId, 'Not enough players for: ' + skipped.join(', '));
  }
  startImposter() {
    const ids = [...this.players.values()].filter(p => p.connected).map(p => p.id);
    if (ids.length < 3) { this.notify(this.hostId, 'You need at least 3 players.'); return; }
    const s = this.settings;
    const k = Math.min(s.imposters, Math.max(1, Math.floor((ids.length - 1) / 2)));
    const cats = s.cats.filter(c => CATEGORIES[c]);
    let pool = [];
    const build = () => { pool = []; for (const c of cats) for (const e of CATEGORIES[c]) if (!this.used.has(e.w)) pool.push({ cat: c, e }); };
    build(); if (!pool.length) { this.used.clear(); build(); }
    const { cat, e } = pick(pool);
    this.used.add(e.w);
    this.game = {
      phase: 'play', cat, word: e.w, light: e.light, strong: e.strong, hint: s.hint,
      imposters: new Set(shuffle(ids).slice(0, k))
    };
  }

  /* End the game for everyone: tell the friends first so they see a thank you, not a reconnect loop. */
  close() {
    for (const p of this.players.values()) {
      if (p.conn && p.connected) { try { p.conn.send({ t: 'closed' }); } catch (e) { /* ignore */ } }
    }
    setTimeout(() => { try { this.peer.destroy(); } catch (e) { /* ignore */ } }, 400);
  }
}

/* ==========================================================================
   Networking: create a room (host) or join one (guest)
   ========================================================================== */
function netReady() {
  if (typeof Peer === 'undefined') {
    ui.error = 'Could not load the networking library. Check your internet connection and refresh.';
    render(); return false;
  }
  return true;
}

function createRoom() {
  if (!netReady()) return;
  ui.screen = 'connecting'; ui.error = ''; render();
  let tries = 0, opened = false;
  const attempt = () => {
    const code = randomCode();
    const peer = new Peer(PREFIX + code, PEER_OPTS);
    peer.on('open', () => {
      opened = true;
      host = new Host(code, peer, ui.name);
      store('session', 'pn_joined', code);
      host.broadcast();
      keepAwake();
    });
    peer.on('error', err => {
      if (opened) { console.warn('peer error', err); return; }
      try { peer.destroy(); } catch (e) { /* ignore */ }
      if (err.type === 'unavailable-id' && tries++ < 6) return attempt();
      ui.screen = 'home'; ui.error = 'Could not create a room. Check your internet connection and try again.'; render();
    });
  };
  attempt();
}

const JOIN_WAIT = window.__JOIN_WAIT || 20;   // how many times to look for the room, 2 seconds apart
const JOIN_TIMEOUT = window.__JOIN_TIMEOUT || 12000;   // how long one attempt may take before it counts as a timeout
function explainFailure(reason, code) {
  const tail = ' (' + reason + ')';
  if (reason === 'peer-unavailable') return 'Room ' + code + ' is not online right now. Ask the host to open the Party Night page and keep it in front, then try again.' + tail;
  if (reason === 'timeout' || reason === 'closed') return 'Could not reach room ' + code + '. Most likely the host page is asleep or closed. Ask them to open Party Night and keep it in front, then try again. If that does not help, your network may be blocking the connection, so try Wi-Fi instead of mobile data.' + tail;
  return 'Could not reach the connection server. Check your internet and try again.' + tail;
}

function joinRoom(code) {
  if (!netReady()) return;
  ui.joinCode = code;
  ui.error = ''; ui.connectMsg = '';
  if (guest) guest.tries = 0;
  connectGuest(true);
}

function connectGuest(first) {
  const code = ui.joinCode;
  if (guest && guest.peer) { guest.leaving = true; try { guest.peer.destroy(); } catch (e) { /* ignore */ } }
  const me = { peer: null, conn: null, leaving: false, tries: guest ? guest.tries : 0 };
  guest = me;
  if (!ui.view) { ui.screen = 'connecting'; render(); }

  const giveUp = text => {
    if (guest !== me) return;
    me.leaving = true; try { me.peer.destroy(); } catch (e) { /* ignore */ }
    guest = null; ui.view = null; ui.lastJson = ''; ui.reconnecting = false;
    ui.screen = 'home'; ui.error = text; render();
  };
  const retry = reason => {
    if (guest !== me || me.leaving || me.retried) return;   // one retry per attempt, even if several events fire
    me.retried = true;
    if (ui.view) {
      if (++me.tries > 20) return giveUp('The host seems to have left the room.');
      ui.reconnecting = true; render();
      setTimeout(() => { if (guest === me) connectGuest(false); }, 2000);
      return;
    }
    // Not in the room yet. If the room is simply not online (host away or still starting), keep looking for a while.
    const max = reason === 'peer-unavailable' ? JOIN_WAIT : 4;
    if (++me.tries > max) return giveUp(explainFailure(reason, code));
    ui.connectMsg = (reason === 'peer-unavailable' || reason === 'timeout') ? 'Still looking for room ' + code + '... the host needs to have the page open.' : 'Connecting...';
    render();
    setTimeout(() => { if (guest === me) connectGuest(false); }, 2000);
  };

  const peer = new Peer(undefined, PEER_OPTS);
  me.peer = peer;
  peer.on('open', () => {
    const conn = peer.connect(PREFIX + code, { reliable: true, serialization: 'json' });
    me.conn = conn;
    const timer = setTimeout(() => { if (!conn.open) retry('timeout'); }, JOIN_TIMEOUT);
    conn.on('open', () => { clearTimeout(timer); conn.send({ t: 'join', name: ui.name, pid: PID }); });
    conn.on('data', msg => {
      if (!msg) return;
      if (msg.t === 'state') {
        store('session', 'pn_joined', code);
        me.tries = 0; ui.reconnecting = false; setView(msg.view);
      } else if (msg.t === 'toast') toast(msg.msg);
      else if (msg.t === 'closed') hostEnded(me);
      else if (msg.t === 'error') giveUp(msg.msg);
    });
    conn.on('close', () => { clearTimeout(timer); retry('closed'); });
  });
  peer.on('error', err => {
    if (guest !== me) return;
    if (err.type === 'peer-unavailable') retry('peer-unavailable');
    else if (!me.conn || !me.conn.open) retry(err.type || 'error');
  });
}

function hostEnded(me) {
  if (guest !== me) return;
  me.leaving = true; try { me.peer.destroy(); } catch (e) { /* ignore */ }
  guest = null; ui.view = null; ui.lastJson = ''; ui.reconnecting = false; ui.joinCode = '';
  store('session', 'pn_joined', '');
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* ignore */ }
  ui.screen = 'home'; ui.notice = 'The host ended the game. Thanks for playing!'; render();
}

function send(msg) {
  if (host) host.handle(host.hostId, msg);
  else if (guest && guest.conn && guest.conn.open) guest.conn.send(msg);
  else toast('Not connected yet.');
}

function setView(v) {
  const s = JSON.stringify(v);
  if (s === ui.lastJson) return;
  ui.lastJson = s;
  const prev = ui.view;
  ui.view = v; ui.screen = 'room';
  if (v.phase === 'play' && (!prev || prev.phase !== 'play')) { ui.showCard = false; ui.dead = {}; }
  render();
}

/* ==========================================================================
   Rendering
   ========================================================================== */
function render() {
  const a = document.activeElement;
  const focusId = a && a.id, selStart = a && a.selectionStart;
  $app.innerHTML = ui.screen === 'home' ? homeHTML() : ui.screen === 'connecting' ? connectingHTML() : roomHTML();
  if (focusId) {
    const el = document.getElementById(focusId);
    if (el) { el.focus(); try { el.setSelectionRange(selStart, selStart); } catch (e) { /* ignore */ } }
  }
}

function homeHTML() {
  const joining = !!ui.joinCode;
  return `<div class="wrap home">
    <div class="logo">🎭</div>
    <h1>Party Night</h1>
    <p class="sub">Social deduction games for you and your friends. Free, no accounts, nothing to install.</p>
    ${ui.notice ? `<div class="banner good">${esc(ui.notice)}</div>` : ''}
    ${ui.error ? `<div class="banner bad">${esc(ui.error)}</div>` : ''}
    <section class="card">
      <label for="nameInput">Your name</label>
      <input id="nameInput" maxlength="16" autocomplete="nickname" placeholder="Your name" value="${esc(ui.name)}">
      ${joining ? `
        <div class="joinbox"><div class="muted">You are joining room</div><div class="roomcode">${esc(ui.joinCode)}</div></div>
        <button class="btn join" data-act="join">Join room</button>
        <div style="text-align:center"><button class="link" data-act="clearcode">Create my own room instead</button></div>
      ` : `
        <button class="btn primary big" data-act="create">Create a room</button>
        <div class="or">or join a friend's room</div>
        <label for="codeInput">Room code</label>
        <input id="codeInput" class="codeinput" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="CODE" value="${esc(ui.codeDraft)}">
        <button class="btn join" data-act="join">Join room</button>
      `}
    </section>
    <p class="foot muted">Games: Imposter, Werewolf and Mafia.<br>Version 8</p>
  </div>`;
}

function connectingHTML() {
  return `<div class="wrap home"><div class="spinner"></div><p class="muted">${esc(ui.connectMsg || 'Connecting...')}</p>
    <button class="link" data-act="leave">Cancel</button></div>`;
}

function avatar(p) {
  return `<span class="av" style="background:hsl(${hue(p.id)} 55% 42%)">${esc((p.name[0] || '?').toUpperCase())}</span>`;
}

function roomHTML() {
  const V = ui.view;
  let body = '';
  switch (V.phase) {
    case 'lobby': body = lobbyHTML(); break;
    case 'play': body = playHTML(); break;
    case 'end': body = endHTML(); break;
  }
  return `<div class="wrap">
    <div class="topbar">
      <span class="brand">🎭 Party Night</span>
      <span class="row">
        <span class="chip" title="Room code">${esc(V.code)}</span>
        <button class="btn small" data-act="invite">Invite</button>
      </span>
    </div>
    ${ui.reconnecting ? '<div class="banner warn">Connection lost. Trying to reconnect...</div>' : ''}
    ${V.me.isHost && V.hostOnline === false ? '<div class="banner warn">Your room went offline, so friends cannot join right now. Reconnecting...</div>' : ''}
    ${body}
    ${V.me.isHost && V.phase === 'end' ? '' : `<div style="text-align:center"><button class="link" data-act="leave">${V.me.isHost ? 'End game' : 'Leave room'}</button></div>`}
  </div>`;
}

function playerRows(opts = {}) {
  const V = ui.view;
  return `<ul class="plist">${V.players.map(p => {
    const tags = [];
    if (p.isHost) tags.push('<span class="tag host">Host</span>');
    if (!p.connected) tags.push('<span class="tag bad">offline</span>');
    return `<li>${avatar(p)}<span class="nm">${esc(p.name)}${p.id === V.me.id ? ' (you)' : ''}</span>${tags.join('')}</li>`;
  }).join('')}</ul>`;
}

/* ----- lobby ----- */
function lobbyHTML() {
  const V = ui.view, s = V.settings, isHost = V.me.isHost, n = V.players.length;
  const maxImp = Math.max(1, Math.floor((n - 1) / 2));
  const hintLabel = { none: 'No hint', light: 'Light hint', strong: 'Strong hint' }[s.hint];
  const def = ROLE_SETS[s.game];
  const seg = (key, cur, opts) => `<div class="seg">${opts.map(([val, label]) => `<button class="${cur === val ? 'on' : ''}" data-act="set" data-key="${key}" data-val="${val}">${label}</button>`).join('')}</div>`;
  let settings;
  if (s.game === 'imposter') {
    settings = isHost ? `
    <div class="setting"><label>Categories (words are picked from these)</label>
      <div class="chips">
        ${V.allCats.map(c => `<button class="chipbtn ${s.cats.includes(c) ? 'on' : ''}" data-act="set" data-key="cat" data-val="${esc(c)}">${esc(c)}</button>`).join('')}
        <button class="chipbtn" data-act="set" data-key="allcats" data-val="1">Select all</button>
      </div></div>
    <div class="setting"><label>Number of imposters (max ${maxImp} for ${n} players)</label>
      <div class="stepper">
        <button data-act="set" data-key="imposters" data-val="${s.imposters - 1}" ${s.imposters <= 1 ? 'disabled' : ''}>-</button>
        <b>${Math.min(s.imposters, maxImp)}</b>
        <button data-act="set" data-key="imposters" data-val="${s.imposters + 1}" ${s.imposters >= maxImp ? 'disabled' : ''}>+</button>
      </div></div>
    <div class="setting"><label>Hint given to the imposter</label>
      ${seg('hint', s.hint, [['none', 'None'], ['light', 'Light'], ['strong', 'Strong']])}</div>
  ` : `<p class="muted">Categories: ${s.cats.length === V.allCats.length ? 'all' : esc(s.cats.join(', '))}.<br>
      Imposters: ${s.imposters}. Hint for the imposter: ${hintLabel.toLowerCase()}.</p>`;
  } else {
    const evilName = def.roles[def.evil].name + (s.game === 'werewolf' ? 's' : ' members');
    const roleKey = s.game === 'werewolf' ? 'wwrole' : 'mfrole';
    const on = def.specials.filter(r => s[def.optKey][r]).map(r => def.roles[r].chip || def.roles[r].name);
    settings = isHost ? `
    <div class="setting"><label>Host narrates and does not get a role</label>
      ${seg('narrator', s.narrator, [[true, 'Yes'], [false, 'No']])}
      <p class="muted" style="margin:8px 0 0">The narrator sees everyone's role and runs the nights in person.</p></div>
    <div class="setting"><label>${evilName}</label>
      ${seg(def.countKey, s[def.countKey], [['auto', 'Auto'], [1, '1'], [2, '2'], [3, '3']])}</div>
    <div class="setting"><label>Special roles</label>
      <div class="chips">${def.specials.map(r => `<button class="chipbtn ${s[def.optKey][r] ? 'on' : ''}" data-act="set" data-key="${roleKey}" data-val="${r}">${def.roles[r].chip || def.roles[r].name}</button>`).join('')}</div></div>
  ` : `<p class="muted">${s.narrator ? 'The host narrates.' : 'Everyone gets a role.'} ${evilName}: ${s[def.countKey] === 'auto' ? 'automatic' : s[def.countKey]}.<br>
      Special roles: ${on.length ? on.join(', ') : 'none'}.</p>`;
  }
  const game = (id, label) => isHost
    ? `<button class="game ${s.game === id ? 'on' : ''}" data-act="set" data-key="game" data-val="${id}">${label}</button>`
    : `<button class="game ${s.game === id ? 'on' : ''}" ${s.game === id ? '' : 'disabled'}>${label}</button>`;
  const blurb = {
    imposter: 'Everyone gets the same secret word, except the imposter. The app only deals out the roles. You play and talk in person.',
    werewolf: 'Villagers hunt the hidden werewolves. The app only deals out the secret roles. The nights, the talking and the voting all happen in person.',
    mafia: 'Town hunts the hidden mafia. The app only deals out the secret roles. The nights, the talking and the voting all happen in person.'
  }[s.game];
  const need = s.game === 'imposter' ? 3 : (s.narrator ? 5 : 4);
  return `
    <section class="card">
      <h2>Game</h2>
      <div class="games">${game('imposter', 'Imposter')}${game('werewolf', 'Werewolf')}${game('mafia', 'Mafia')}</div>
      <p class="muted" style="margin-top:10px">${blurb}</p>
    </section>
    <section class="card"><h2>Players (${n})</h2>${playerRows()}
      <p class="muted">Share the room code <b>${esc(V.code)}</b> or tap Invite to send the link.</p>
      ${isHost ? '<p class="muted">Keep this page open while friends join. On a phone, come back to this page before they try to join.</p>' : ''}</section>
    <section class="card"><h2>Settings</h2>${settings}</section>
    ${isHost
      ? `<button class="btn primary" data-act="start" ${n < need ? 'disabled' : ''}>${n < need ? 'Need at least ' + need + ' players' + (s.game !== 'imposter' && s.narrator ? ' (the host narrates)' : '') : 'Start game'}</button>`
      : '<p class="muted" style="text-align:center">Waiting for the host to start...</p>'}`;
}

/* ----- secret card ----- */
function teamClass(t) { return t === 'evil' ? 'bad' : t === 'neutral' ? 'neutral' : 'good'; }
function roleHTML(r) {
  if (r.type === 'role') {
    const evil = r.team === 'evil';
    return `<div class="role ${evil ? 'imp' : ''}"><span class="tag ${teamClass(r.team)}">${esc(r.teamName)}</span>
      <div class="word">${esc(r.name)}</div>
      <p class="muted">${esc(r.blurb)}</p>
      ${r.mates.length ? `<p>Your ${esc(r.mateWord)}: <b>${r.mates.map(m => esc(m)).join(', ')}</b></p>` : ''}</div>`;
  }
  if (r.imp) {
    return `<div class="role imp"><span class="tag bad">You are the IMPOSTER</span>
      <p>Category: <b>${esc(r.cat)}</b></p>
      ${r.hint ? `<p>Your hint: <b>${esc(r.hint)}</b></p>` : '<p class="muted">No hint this time. Listen closely.</p>'}
      <p class="muted">Blend in. Say things that sound like you know the secret word.</p></div>`;
  }
  return `<div class="role"><span class="tag good">You are on the crew</span>
    <div class="word">${esc(r.word)}</div>
    <p>Category: <b>${esc(r.cat)}</b></p>
    <p class="muted">Talk about it in person without making it too easy for the imposter.</p></div>`;
}
function secretHTML() {
  const V = ui.view;
  return `<section class="card secret">
    <div class="row between"><b>Your secret card</b><button class="btn small" data-act="togglecard">${ui.showCard ? 'Hide' : 'Show'}</button></div>
    ${ui.showCard ? roleHTML(V.role) : '<p class="muted">Hidden. Make sure nobody is looking, then tap Show.</p>'}
  </section>`;
}

/* ----- play: roles are dealt, everything else happens in person ----- */
function narratorHTML() {
  const V = ui.view, nr = V.narrator;
  const rows = nr.roster.map(p => `<li class="${ui.dead[p.id] ? 'out' : ''}" data-act="mark" data-id="${esc(p.id)}">${avatar(p)}<span class="nm">${esc(p.name)}</span><span class="tag ${teamClass(p.team)}">${esc(p.roleName)}</span></li>`).join('');
  return `<section class="card"><h2>You are the narrator</h2>
      <p>You do not get a role. Run the nights in person and keep this screen hidden from the players.</p></section>
    <section class="card secret"><div class="row between"><b>Who is who</b><button class="btn small" data-act="togglecard">${ui.showCard ? 'Hide' : 'Show'}</button></div>
      ${ui.showCard ? `<ul class="plist narr">${rows}</ul><p class="muted">Tap a name to cross out a player who is out.</p>` : '<p class="muted">Hidden. Make sure nobody is looking, then tap Show.</p>'}</section>
    <section class="card"><h2>Each night</h2><ol class="script">${nr.script.map(x => `<li>${esc(x)}</li>`).join('')}</ol>
      <p class="muted">${esc(nr.win)}</p></section>`;
}
function playHTML() {
  const V = ui.view, me = V.me;
  const finish = me.isHost ? '<button class="btn primary big" data-act="finish">Reveal roles</button>' : '<p class="muted" style="text-align:center">The host reveals the roles at the end of the round.</p>';
  if (V.narrator) return narratorHTML() + finish;
  if (!V.role) return `<section class="card"><h2>Next round</h2><p>You joined after the roles were dealt. You will get a role in the next round.</p></section>${finish}`;
  return `<section class="card"><h2>Your role</h2>
      <p>Check your secret card, then play in person. Keep it hidden from everyone else.</p></section>
    ${secretHTML()}
    ${finish}`;
}

/* ----- end: show the answer, then the host picks play again or end game ----- */
function endHTML() {
  const V = ui.view, e = V.end, me = V.me;
  const name = id => (V.players.find(p => p.id === id) || { name: '?' }).name;
  const buttons = me.isHost
    ? '<button class="btn primary big" data-act="again">Play again</button><button class="btn" data-act="endgame">End game</button>'
    : '<p class="muted" style="text-align:center">Waiting for the host to play again or end the game...</p>';
  if (e.roster) {
    const rows = e.roster.map(p => `<li>${avatar(p)}<span class="nm">${esc(p.name)}</span><span class="tag ${teamClass(p.team)}">${esc(p.roleName)}</span></li>`).join('');
    return `<section class="card winner">
        <div class="big">Roles revealed</div>
        ${e.narrator ? `<p class="muted" style="text-align:center">Narrator: ${esc(e.narrator)}</p>` : ''}
        <ul class="plist">${rows}</ul>
      </section>
      ${buttons}`;
  }
  return `<section class="card winner">
      <div class="big">Roles revealed</div>
      <p style="text-align:center">The secret word was</p>
      <div class="word" style="text-align:center">${esc(e.word)}</div>
      <p class="muted" style="text-align:center">Category: ${esc(e.cat)}</p>
      <p style="text-align:center">${e.imposters.length > 1 ? 'The imposters were' : 'The imposter was'} <b>${e.imposters.map(i => esc(name(i))).join(' and ')}</b></p>
    </section>
    ${buttons}`;
}

/* ==========================================================================
   Events
   ========================================================================== */
function parseVal(v) {
  if (v === 'true') return true;
  if (v === 'false') return false;
  if (/^-?\d+$/.test(v)) return +v;
  return v;
}
function needName() {
  const n = cleanName(ui.name);
  if (!ui.name.trim()) { ui.error = 'Please enter your name first.'; render(); return false; }
  ui.name = n; store('local', 'pn_name', n); return true;
}

const A = {
  create() { ui.notice = ''; if (needName()) createRoom(); },
  join() {
    ui.notice = '';
    if (!needName()) return;
    const code = (ui.joinCode || ui.codeDraft || '').toUpperCase();
    if (!/^[A-Z]{4}$/.test(code)) { ui.error = 'Enter the 4 letter room code.'; render(); return; }
    joinRoom(code);
  },
  clearcode() { ui.joinCode = ''; ui.error = ''; history.replaceState(null, '', location.pathname + location.search); render(); },
  leave() {
    if (host && !confirm('End the game for everyone?')) return;
    try { store('session', 'pn_joined', ''); } catch (e) { /* ignore */ }
    const go = () => { location.href = location.href.split('#')[0]; };
    if (host) { host.close(); setTimeout(go, 600); } else go();
  },
  invite() {
    const code = ui.view.code, url = location.href.split('#')[0] + '#' + code;
    const fallback = () => {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(() => toast('Invite link copied'), () => window.prompt('Copy this link', url));
      else window.prompt('Copy this link', url);
    };
    if (navigator.share) navigator.share({ title: 'Party Night', text: 'Join my room ' + code, url }).catch(e => { if (e.name !== 'AbortError') fallback(); });
    else fallback();
  },
  set(d) { send({ t: 'settings', key: d.key, val: parseVal(d.val) }); },
  start() { send({ t: 'start' }); },
  togglecard() { ui.showCard = !ui.showCard; render(); },
  mark(d) { ui.dead[d.id] = !ui.dead[d.id]; render(); },
  finish() { send({ t: 'finish' }); },
  endgame() { A.leave(); },
  again() { send({ t: 'again' }); }
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const fn = A[b.dataset.act];
  if (fn) fn(b.dataset);
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'nameInput') ui.name = e.target.value;
  else if (id === 'codeInput') { ui.codeDraft = e.target.value.toUpperCase().replace(/[^A-Z]/g, ''); e.target.value = ui.codeDraft; }
  else if (id) ui.drafts[id] = e.target.value;
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const id = e.target.id;
  if (id === 'codeInput') A.join();
  else if (id === 'nameInput') (ui.joinCode ? A.join() : (ui.codeDraft ? A.join() : A.create()));
});

/* ==========================================================================
   Boot
   ========================================================================== */
/* Keep the host's screen awake, and re-register the room when the page comes back to the front. */
let wakeLock = null;
async function keepAwake() {
  try { if (host && 'wakeLock' in navigator && !document.hidden) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) { /* not supported or refused */ }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && host) { host.recover(); keepAwake(); setTimeout(() => host && host.probe(), 1500); } });
window.addEventListener('online', () => { if (host) { host.recover(); setTimeout(() => host && host.probe(), 1500); } });
setInterval(() => { if (host && !document.hidden) host.probe(); }, 60000);

(function boot() {
  const m = location.hash.match(/([A-Za-z]{4})/);
  if (m) ui.joinCode = m[1].toUpperCase();
  // Refreshing a guest tab: rejoin automatically.
  if (ui.joinCode && store('session', 'pn_joined') === ui.joinCode && ui.name.trim()) {
    render(); joinRoom(ui.joinCode); return;
  }
  render();
})();
</script>
